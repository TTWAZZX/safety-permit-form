    <style>
        /* ================= CORPORATE SECURITY THEME ================= */
        :root {
            --primary-color: #0f2027; 
            --secondary-color: #203a43;
            --accent-color: #d4af37; 
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --border-color: #dee2e6;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f8f9fa;
            --border-color: #343a40;
        }

        .attendance-late { color: #b91c1c !important; }
        [data-theme="dark"] #checkInStatus,
        [data-theme="dark"] #time_in.attendance-late { color: #fca5a5 !important; }

        /* 📱 ปรับ padding-bottom ให้พอดีกับเมนูด้านล่าง */
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; transition: 0.3s; }
        .container { max-width: 500px; padding: 0 15px; display: none; }

        /* ================= LOADING SCREEN ================= */
        #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner-border { color: var(--accent-color); width: 3rem; height: 3rem; margin-bottom: 15px; }

        /* ================= HEADER & PROFILE ================= */
        .profile-header { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white; padding: 30px 20px; border-radius: 0 0 30px 30px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); position: relative; }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--accent-color); object-fit: cover; background: white; padding: 2px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .theme-toggle { background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; transition: 0.3s;}
        
        /* 🔄 อนิเมชันปุ่มรีเฟรช */
        .bi-spin { animation: spinIcon 1s linear infinite; }
        @keyframes spinIcon { 100% { transform: rotate(360deg); } }

        /* ================= INFO CARDS ================= */
        .info-card { background: var(--card-bg); border-radius: 16px; padding: 15px; text-align: center; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-top: -20px; position: relative; z-index: 2; }
        .clock-display { font-size: 2.5rem; font-weight: 700; font-family: monospace; color: var(--accent-color); letter-spacing: 2px; line-height: 1; margin-top: 5px; }

        .main-card { background: var(--card-bg); border-radius: 20px; padding: 25px 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-top: 15px; }

        .form-label { font-size: 0.85rem; font-weight: 700; color: #6c757d; text-transform: uppercase; }
        .form-control, .form-select { border-radius: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); padding: 12px; font-weight: 500; }
        .form-control:focus, .form-select:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2); }
        .form-control[readonly] { background-color: rgba(0,0,0,0.03); }

        /* TomSelect Theme */
        .ts-control { border-radius: 10px; padding: 12px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); }
        .ts-dropdown { border-radius: 10px; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); }
        .ts-dropdown .active { background-color: rgba(212, 175, 55, 0.1); color: var(--text-main); }

        .btn-submit { background: var(--primary-color); color: white; width: 100%; border-radius: 12px; padding: 15px; font-weight: 700; font-size: 1.1rem; border: none; box-shadow: 0 6px 15px rgba(15, 32, 39, 0.3); transition: 0.2s; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #6c757d; box-shadow: none; }

        /* ================= HISTORY ================= */
        .history-item { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--accent-color); border-right: 1px solid var(--border-color); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .action-btn { background: none; border: none; color: #6c757d; font-size: 1.1rem; padding: 5px; transition: 0.2s; }
        .action-btn:hover { color: var(--primary-color); transform: scale(1.1); }
        .action-btn.delete:hover { color: #dc3545; }

        /* ================= 📱 BOTTOM NAVIGATION (App Style) ================= */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--card-bg); border-top: 1px solid var(--border-color);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 1000;
            display: flex; justify-content: space-around; padding: 10px 0 15px;
            padding-bottom: env(safe-area-inset-bottom); /* รองรับขอบจอมือถือ */
        }
        .bottom-nav .nav-item {
            text-align: center; color: #6c757d; text-decoration: none;
            font-size: 0.85rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; transition: 0.2s; width: 50%;
        }
        .bottom-nav .nav-item i { font-size: 1.6rem; margin-bottom: 2px; }
        .bottom-nav .nav-item.active { color: var(--accent-color); }
        
        /* ซ่อน/โชว์ หน้าต่าง */
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ขยายขนาดแถวใน Dropdown ให้จิ้มง่ายขึ้นสำหรับมือถือ */
        .ts-dropdown .option {
            padding: 12px 15px !important;
            font-size: 1.1rem !important;
        }
    </style>
</head>

<script src="guard-attendance.js"></script>
<script src="guard-checkin-session.js"></script>
<script>
// ================= CONFIG =================
const SUPABASE_URL = 'https://dqsfioiqwxuxpucwwhsv.supabase.co';
const LIFF_ID = '2007053300-gJitj7Vr';

async function guardAttendanceRequest(operation, values = {}) {
    const token = liff.getAccessToken();
    if (!token) throw new Error('กรุณาเข้าสู่ระบบ LINE ใหม่');
    const response = await fetch(SUPABASE_URL + '/functions/v1/legacy-safety-access', {
        method: 'POST', cache: 'no-store', credentials: 'omit', redirect: 'error',
        headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...values, action: 'guard-attendance', operation }),
        signal: AbortSignal.timeout(20000)
    });
    const result = await response.json().catch(() => null);
    if (response.status === 401) throw new Error('กรุณาเข้าสู่ระบบ LINE ใหม่');
    if (response.status === 422) throw new Error('กรุณาตรวจสอบเวลาเข้าและเวลาออกเวร');
    if (response.status === 429) throw new Error('ส่งคำขอหลายครั้ง กรุณารอสักครู่');
    if (!response.ok || !result) throw new Error('ไม่สามารถอ่านหรือบันทึกข้อมูลลงเวลาได้');
    return result;
}

let selectCardInstance, selectPersonInstance, selectSubstituteInstance;
let activeRecord = null;
let sessionRequest = 0;
let sessionPending = false;
let sessionError = false;
let submitPending = false;
let currentMode = 'work'; // โหมดเริ่มต้น

// 🟢 ตัวแปรสำหรับระบบแบ่งหน้า (Pagination)
let currentPastPage = 1;
const ITEMS_PER_PAGE = 10;

// ================= INIT =================
window.onload = async () => {
    initTheme();
    startLiveClock();
    document.getElementById('work_date').value = guardBangkokClock().date;

    try {
        await updateLoader("กำลังอัปเดตข้อมูลผู้ใช้...", 300);
        await liff.init({ liffId: LIFF_ID });
        
        const violationLoginKey = 'guard-violation-login-pending';
        if (new URLSearchParams(location.search).get('continue') === 'guard-violation') {
            sessionStorage.setItem(violationLoginKey, '1');
        }
        if (!liff.isLoggedIn()) { liff.login(); return; }
        if (sessionStorage.getItem(violationLoginKey) === '1') {
            sessionStorage.removeItem(violationLoginKey);
            const token = liff.getAccessToken();
            if (!token) throw new Error('LINE access token unavailable');
            sessionStorage.setItem('guard-violation-line-session', token);
            location.replace(new URL('guard_violation.html', location.href));
            return;
        }

        const profile = await liff.getProfile();
        document.getElementById('displayName').innerText = profile.displayName;
        if(profile.pictureUrl) {
            document.getElementById('profileImage').src = profile.pictureUrl;
            document.getElementById('picUrl').value = profile.pictureUrl;
        }

        await updateLoader("เตรียมพร้อมระบบ...", 200);
        await Promise.all([loadMasterData(), fetchHistory()]);

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';

    } catch (err) { 
        console.error('LIFF Error:', err);
        await Promise.all([loadMasterData(), fetchHistory()]);
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
    }
};

function updateLoader(text, delay) { return new Promise(r => { document.getElementById('loadStatusMain').innerText = text; setTimeout(r, delay); }); }

// ================= 📱 APP NAVIGATION =================
function switchPage(page) {
    document.getElementById('formPage').classList.remove('active');
    document.getElementById('historyPage').classList.remove('active');
    document.getElementById('nav-form').classList.remove('active');
    document.getElementById('nav-history').classList.remove('active');

    if(page === 'form') {
        document.getElementById('formPage').classList.add('active');
        document.getElementById('nav-form').classList.add('active');
        checkActiveSession();
    } else {
        document.getElementById('historyPage').classList.add('active');
        document.getElementById('nav-history').classList.add('active');
        fetchHistory(); 
    }
}

// ================= CLOCK & THEME =================
function startLiveClock() {
    const clock = document.getElementById('liveClock');
    const update = () => { clock.textContent = guardBangkokClock().time; };
    update();
    setInterval(update, 1000);
}
function initTheme() {
    const savedTheme = localStorage.getItem('sec_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeIcon').className = savedTheme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
}
function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('sec_theme', next);
    document.getElementById('themeIcon').className = next === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
}

// ================= SMART CHECK-IN/OUT =================
async function checkActiveSession() {
    const request = ++sessionRequest;
    const card = document.getElementById('id_card').value;
    const name = document.getElementById('fullname').value;
    const date = document.getElementById('work_date').value;
    const shiftInput = document.getElementById('shift');
    const clock = guardBangkokClock();
    const dates = guardSessionDates(date, shiftInput.value, clock);
    if (!card || !name || !date) {
        sessionPending = sessionError = false;
        setActiveRecord(null);
        return true;
    }
    sessionPending = true;
    sessionError = false;
    renderSessionState();

    try {
        const { rows: data } = await guardAttendanceRequest('session', { card, fullname: name, dates });
        if (request !== sessionRequest) return false;

        const record = chooseGuardSession(data, dates, shiftInput.value);
        if (record && !shiftInput.value) selectGuardShift(record.shift);
        sessionPending = false;
        setActiveRecord(record);
        return true;
    } catch (error) {
        if (request !== sessionRequest) return false;
        sessionPending = false;
        sessionError = true;
        setActiveRecord(null);
        console.error('ตรวจสอบเวรไม่สำเร็จ', error);
        return false;
    }
}

function selectGuardShift(value) {
    const input = document.getElementById('shift');
    const key = getGuardShift(value);
    const option = [...input.options].find(option => key && getGuardShift(option.value) === key);
    if (option) input.value = option.value;
}

function setActiveRecord(record) {
    if (activeRecord?.id !== record?.id && (activeRecord || record)) {
        document.getElementById('time_in').value = record?.time_in || '';
        if (activeRecord) document.getElementById('time_out').value = '';
    }
    activeRecord = record;
    renderSessionState();
}

function renderSessionState() {
    const status = document.getElementById('activeSessionStatus');
    const timeIn = document.getElementById('time_in');
    const button = document.getElementById('btnSubmit');
    const isLeave = currentMode === 'leave';
    timeIn.disabled = Boolean(activeRecord);
    document.getElementById('useCurrentIn').disabled = Boolean(activeRecord) || sessionPending || sessionError;
    document.getElementById('useCurrentOut').disabled = sessionPending || sessionError;
    document.getElementById('workRemarks').classList.toggle('d-none', Boolean(activeRecord));
    button.disabled = sessionPending || sessionError || submitPending || Boolean(isLeave && activeRecord);
    button.textContent = submitPending ? 'กำลังบันทึก…' : isLeave ? 'บันทึกลางาน' : activeRecord ? 'ลงเวลาออก' : 'ตรวจสอบและบันทึกเวลา';
    status.className = 'rounded-3 mb-3';
    if (sessionPending) {
        status.textContent = 'กำลังตรวจสอบเวรที่เปิดอยู่…';
    } else if (sessionError) {
        status.classList.add('alert', 'alert-danger');
        status.textContent = 'ตรวจสอบเวรที่เปิดอยู่ไม่สำเร็จ กรุณากดรีเฟรชก่อนบันทึก';
    } else if (activeRecord) {
        status.classList.add('alert', 'alert-info');
        status.textContent = 'เวรที่เปิดอยู่ · ' + guardDutyLabel(activeRecord.work_date, activeRecord.shift) +
            ' · เข้า ' + activeRecord.time_in + ' น.' + (isLeave ? ' กรุณาลงเวลาออกก่อนลางาน' : '');
    } else {
        status.textContent = '';
    }
    status.classList.toggle('d-none', !status.textContent);
    updateCheckInStatus();
}

function fillGuardTime(field) {
    const input = document.getElementById(field);
    if (input.disabled || currentMode !== 'work' || sessionPending || sessionError) return;
    input.value = guardBangkokClock().time.slice(0, 5);
    updateCheckInStatus();
}

// ================= LOAD DATA & MEMORY =================
async function loadMasterData() {
    try {
        const currentCard = document.getElementById('id_card').value;
        const currentName = document.getElementById('fullname').value;
        const currentShift = document.getElementById('shift').value;
        const { cards, people: persons } = await guardAttendanceRequest('masters');
        const selectCard = document.getElementById('id_card');
        
        // เคลียร์ TomSelect เก่าออกก่อนป้องกัน Error ตอน Refresh
        if (selectCardInstance) selectCardInstance.destroy();
        selectCard.innerHTML = '<option value="">เลือกการ์ด...</option>';
        if (cards) cards.forEach(c => selectCard.add(new Option(c.card_number, c.card_number)));
        
        selectCardInstance = new TomSelect("#id_card", { 
            create: false, 
            sortField: { field: "text", direction: "asc" },
            controlInput: null, // 🟢 ปิดช่องพิมพ์ค้นหา ให้เลือกอย่างเดียว
            onChange: function() { checkActiveSession(); } 
        });

        const selectPerson = document.getElementById('fullname');
        const selectSub = document.getElementById('remark_substitute'); 
        
        if (selectPersonInstance) selectPersonInstance.destroy();
        if (selectSubstituteInstance) selectSubstituteInstance.destroy();

        selectSub.innerHTML = '<option value="">เลือกชื่อผู้ที่ถูกแทน...</option>';
        
        if (persons) {
            persons.forEach(p => {
                selectPerson.add(new Option(p.fullname, p.fullname));
                selectSub.add(new Option(p.fullname, p.fullname));
            });
        }

        // สำหรับพนักงานปฏิบัติงาน
        selectPersonInstance = new TomSelect("#fullname", { 
            create: false, 
            sortField: { field: "text", direction: "asc" },
            controlInput: null, // 🟢 ปิดช่องพิมพ์ค้นหา ให้เลือกอย่างเดียว

        });

        // สำหรับรายชื่อคนถูกแทนในช่องหมายเหตุ
        selectSubstituteInstance = new TomSelect("#remark_substitute", { 
            create: false, 
            sortField: { field: "text", direction: "asc" },
            controlInput: null // 🟢 ปิดช่องพิมพ์ค้นหา ให้เลือกอย่างเดียว
        });

        // Memory (จดจำค่าล่าสุด)
        selectCardInstance.setValue(currentCard || localStorage.getItem('sec_last_card') || '', true);
        selectPersonInstance.setValue(currentName || localStorage.getItem('sec_last_name') || '', true);
        selectGuardShift(currentShift || localStorage.getItem('sec_last_shift'));

        await checkActiveSession();
    } catch (err) { console.error("Load Master Error:", err); }
}
// ================= ⏰ CUSTOM TIME FORMATTER (Numpad) =================
function formatTime(input) {
    let val = input.value.replace(/\D/g, ''); 
    if (val.length > 2) {
        val = val.substring(0, 2) + ':' + val.substring(2, 4); 
    }
    input.value = val;
}
function validateTimeStr(timeStr) {
    return !timeStr || /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(timeStr);
}

function updateCheckInStatus() {
    const input = document.getElementById('time_in');
    const shiftValue = document.getElementById('shift').value;
    const minutes = getGuardLateness(shiftValue, input.value);
    const isLate = !input.disabled && currentMode === 'work' && minutes > 0;
    const shift = guardShifts[getGuardShift(shiftValue)];
    document.getElementById('checkInStatus').textContent = isLate
        ? `มาสาย ${minutes} นาที (เริ่มกะ ${shift.startsAt} น.)` : '';
    input.classList.toggle('attendance-late', isLate);
    input.classList.toggle('text-success', !isLate);
}

document.getElementById('shift').addEventListener('change', checkActiveSession);
document.getElementById('work_date').addEventListener('change', checkActiveSession);

// ================= HISTORY (ระบบใหม่ เฉพาะบุคคล + วันที่ไทยเป๊ะๆ) =================
async function fetchHistory() {
    currentPastPage = 1;
    const listToday = document.getElementById('listToday');
    const listPast = document.getElementById('listPast');
    const btnContainer = document.getElementById('btnLoadMoreContainer');

    // 🟢 1. พยายามดึงชื่อจากหลายๆ จุด เพื่อให้ได้ชื่อที่ถูกต้องที่สุด
    let nameFilter = document.getElementById('fullname').value;
    if (!nameFilter && selectPersonInstance) { nameFilter = selectPersonInstance.getValue(); }
    if (!nameFilter) { nameFilter = localStorage.getItem('sec_last_name'); }

    if (!nameFilter) {
        listToday.innerHTML = '<div class="text-center text-muted small py-4"><i class="bi bi-info-circle text-primary mb-2" style="font-size: 2rem; display: block;"></i>กรุณาเลือกรหัส/ชื่อ<br>ในหน้า "ลงเวลา" ก่อนดูประวัติครับ</div>';
        listPast.innerHTML = '<div class="text-center text-muted small py-4"><i class="bi bi-info-circle text-primary mb-2" style="font-size: 2rem; display: block;"></i>กรุณาเลือกรหัส/ชื่อ<br>ในหน้า "ลงเวลา" ก่อนดูประวัติครับ</div>';
        btnContainer.classList.add('d-none');
        return;
    }

    listToday.innerHTML = '<div class="text-center text-muted small py-3">กำลังโหลด...</div>';
    listPast.innerHTML = '<div class="text-center text-muted small py-3">กำลังโหลด...</div>';
    btnContainer.classList.add('d-none');

    try {
        // 🟢 2. บังคับใช้วันที่เวลาประเทศไทย (ป้องกันบั๊ก UTC ข้ามวัน)
        const todayStr = guardBangkokClock().date;

        // 🟢 3. ดึงข้อมูล "วันนี้"
        const { rows: dataToday } = await guardAttendanceRequest('today', { fullname: nameFilter, date: todayStr });

        // ใส่ป้ายบอกว่ากำลังดูของใครอยู่
        listToday.replaceChildren(historyText('div', 'badge bg-primary bg-opacity-10 text-primary mb-3 w-100 py-2 fs-6 shadow-sm border', 'ประวัติวันนี้ของ ' + nameFilter));
        
        if (dataToday && dataToday.length > 0) {
            listToday.append(...dataToday.map(generateHistoryCard));
        } else {
            listToday.append(historyText('div', 'text-center text-muted small py-3', 'ไม่มีประวัติลงเวลาของวันนี้'));
        }

        // 🟢 4. โหลดข้อมูล "ย้อนหลัง" พร้อมส่งวันที่ไทยเข้าไป
        await loadPastHistory(nameFilter, todayStr);

    } catch (err) { console.error(err); }
}

async function loadPastHistory(nameFilter, todayStr) {
    try {
        const from = (currentPastPage - 1) * ITEMS_PER_PAGE;
        const { rows: dataPast } = await guardAttendanceRequest('history', { fullname: nameFilter, date: todayStr, offset: from });

        const listPast = document.getElementById('listPast');
        if (currentPastPage === 1) {
            listPast.replaceChildren(historyText('div', 'badge bg-secondary bg-opacity-10 text-secondary mb-3 w-100 py-2 fs-6 shadow-sm border', 'ประวัติย้อนหลังของ ' + nameFilter));
        }
        if (dataPast?.length) {
            listPast.append(...dataPast.map(generateHistoryCard));
        } else if (currentPastPage === 1) {
            listPast.append(historyText('div', 'text-center text-muted small py-3', 'ไม่มีประวัติย้อนหลังในระบบ'));
        }

        // เช็คโชว์ปุ่ม Load More
        const btnContainer = document.getElementById('btnLoadMoreContainer');
        if (dataPast && dataPast.length === ITEMS_PER_PAGE) {
            btnContainer.classList.remove('d-none');
        } else {
            btnContainer.classList.add('d-none');
        }

    } catch (err) { console.error(err); }
}

function loadMorePast() {
    const btn = document.getElementById('btnLoadMore');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" style="width: 1rem; height: 1rem;"></span> กำลังโหลด...';
    btn.disabled = true;

    currentPastPage++; 
    
    let nameFilter = document.getElementById('fullname').value || localStorage.getItem('sec_last_name');
    const todayStr = guardBangkokClock().date;

    loadPastHistory(nameFilter, todayStr).then(() => {
        btn.innerHTML = 'ดูประวัติเก่ากว่านี้ <i class="bi bi-chevron-down"></i>';
        btn.disabled = false;
    });
}

// 🎨 ฟังก์ชันแยกสำหรับสร้างการ์ด HTML (เพื่อไม่ให้โค้ดซ้ำซ้อน)
function historyText(tag, className, value) {
    const node = document.createElement(tag);
    node.className = className;
    node.textContent = value ?? '';
    return node;
}

function generateHistoryCard(item) {
    const shiftText = guardShifts[getGuardShift(item.shift)]?.label || item.shift || '-';
    const lateMinutes = getGuardLateness(item.shift, item.time_in, item.remark_type);
    const timeInClass = lateMinutes > 0 ? 'attendance-late' : lateMinutes === 0 ? 'text-success' : 'text-muted';
    const card = historyText('div', 'history-item animate__animated animate__fadeIn');
    const heading = historyText('div', 'd-flex justify-content-between align-items-center mb-1');
    heading.append(
        historyText('div', 'fw-bold', item.work_date),
        historyText('div', 'badge bg-secondary bg-opacity-10 text-dark border', shiftText)
    );
    const detail = item.remark_detail ? ' (' + item.remark_detail + ')' : '';
    const times = historyText('div', 'bg-light p-2 rounded text-center border small');
    times.append(historyText('span', timeInClass + ' fw-bold', item.time_in ? 'IN: ' + item.time_in : '-'));
    if (item.time_out) times.append(historyText('span', 'text-danger fw-bold ms-2', 'OUT: ' + item.time_out));
    if (lateMinutes > 0) times.append(historyText('div', 'attendance-late fw-bold mt-1', `มาสาย ${lateMinutes} นาที`));
    const actions = historyText('div', 'mt-2 text-end border-top pt-2');
    const edit = historyText('button', 'action-btn', 'แก้ไข');
    edit.type = 'button';
    edit.addEventListener('click', () => userEdit(item.id, item.id_card, item.time_in, item.time_out));
    const remove = historyText('button', 'action-btn delete ms-2', 'ลบ');
    remove.type = 'button';
    remove.addEventListener('click', () => userDelete(item.id, item.id_card));
    actions.append(edit, remove);
    card.append(heading, historyText('div', 'small text-muted mb-2', `${item.id_card ?? '-'} | ${item.remark_type ?? '-'}${detail}`), times, actions);
    return card;
}

// ================= USER EDIT/DELETE =================
async function verifyUser(id_card) {
    const { value: confirmId } = await Swal.fire({
        title: 'ยืนยันตัวตน', text: 'กรุณากรอก "รหัสบัตรประจำตัว" เพื่อยืนยัน',
        input: 'text', inputPlaceholder: 'เช่น G-001',
        showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก',
        inputValidator: (value) => { if (!value) return 'กรุณากรอกรหัสบัตร!' }
    });
    return confirmId === id_card;
}

async function userEdit(id, id_card, currentIn, currentOut) {
    if(!(await verifyUser(id_card))) return Swal.fire('ผิดพลาด', 'รหัสบัตรไม่ตรงกับรายการนี้', 'error');

    const { value: formValues } = await Swal.fire({
        title: 'แก้ไขเวลา',
        html: `
            <div class="text-start mt-3">
                <label class="form-label text-success">เวลาเข้า</label>
                <input type="text" id="swal-in" class="form-control mb-3 text-center" inputmode="numeric" placeholder="ระบุเวลา" maxlength="5" oninput="formatTime(this)">
                <label class="form-label text-danger">เวลาออก</label>
                <input type="text" id="swal-out" class="form-control text-center" inputmode="numeric" placeholder="ระบุเวลา" maxlength="5" oninput="formatTime(this)">
            </div>
        `,
        didOpen: () => {
            document.getElementById('swal-in').value = currentIn?.slice(0, 5) || '';
            document.getElementById('swal-out').value = currentOut?.slice(0, 5) || '';
        },
        focusConfirm: false, showCancelButton: true, confirmButtonText: 'บันทึก',
        preConfirm: () => { 
            const tin = document.getElementById('swal-in').value;
            const tout = document.getElementById('swal-out').value;
            if((tin && !validateTimeStr(tin)) || (tout && !validateTimeStr(tout))) { Swal.showValidationMessage('รูปแบบเวลาไม่ถูกต้อง (00:00 - 23:59)'); return false; }
            return { in: tin, out: tout };
        }
    });

    if (formValues) {
        Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading() });
        try {
            const { row } = await guardAttendanceRequest('edit', {
                id, card: id_card, timeIn: formValues.in || null, timeOut: formValues.out || null
            });
            if (!row) throw new Error('ไม่พบรายการลงเวลาหรือรหัสบัตรไม่ตรง');
            Swal.fire({ icon: 'success', title: 'อัปเดตเรียบร้อย', timer: 1500, showConfirmButton: false });
            fetchHistory();
        } catch (error) {
            Swal.fire('แก้ไขไม่สำเร็จ', error.message, 'error');
        }
    }
}

async function userDelete(id, id_card) {
    if(!(await verifyUser(id_card))) return Swal.fire('ผิดพลาด', 'รหัสบัตรไม่ตรงกับรายการนี้', 'error');
    const res = await Swal.fire({ title: 'ยืนยันการลบ?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc3545', confirmButtonText: 'ลบทิ้ง' });
    if(res.isConfirmed) {
        try {
            const { row } = await guardAttendanceRequest('delete', { id, card: id_card });
            if (!row) throw new Error('ไม่พบรายการลงเวลาหรือรหัสบัตรไม่ตรง');
            Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', timer: 1500, showConfirmButton: false });
            fetchHistory();
        } catch (error) {
            Swal.fire('ลบไม่สำเร็จ', error.message, 'error');
        }
    }
}

// ================= SUBMIT FORM =================
document.getElementById('attendanceForm').addEventListener('submit', async event => {
    event.preventDefault();
    if (sessionPending || sessionError || submitPending) return;

    const value = id => document.getElementById(id).value;
    const record = activeRecord;
    const isLeave = currentMode === 'leave';
    if (isLeave && record) return;
    const timeIn = record?.time_in || value('time_in') || null;
    const timeOut = value('time_out') || null;
    if (!isLeave) {
        if (record && !timeOut) return Swal.fire('ระบุเวลาออก', 'กรุณาระบุเวลาออกจากเวรที่เปิดอยู่', 'warning');
        if (!timeIn && !timeOut) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาระบุเวลาอย่างน้อย 1 ช่อง', 'warning');
        if ((!record && !validateTimeStr(timeIn)) || !validateTimeStr(timeOut)) {
            return Swal.fire('เวลาผิดพลาด', 'กรุณากรอกเวลาให้ถูกต้อง (00:00 - 23:59)', 'error');
        }
    }

    const remark = isLeave ? value('leave_type') : value('remark_type');
    let detail = null;
    if (isLeave && !remark) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาเลือกประเภทการลา', 'warning');
    if (!record && !isLeave && remark.includes('แทน')) {
        detail = value('remark_substitute');
        if (!detail) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาเลือกชื่อผู้ที่ปฏิบัติงานแทน', 'warning');
    } else if (!record && !isLeave && remark === 'อื่นๆ') {
        detail = value('remark_detail');
    }

    const payload = {
        work_date: record?.work_date || value('work_date'),
        shift: record?.shift || value('shift'),
        id_card: value('id_card'),
        fullname: value('fullname'),
        time_in: isLeave ? null : timeIn,
        time_out: isLeave ? null : timeOut,
        remark_type: remark,
        remark_detail: detail || null,
        profile_pic: value('picUrl') || null,
        status: 'Active'
    };

    submitPending = true;
    renderSessionState();
    try {
        if (!isLeave) {
            const result = await Swal.fire({
                title: record ? 'ยืนยันลงเวลาออก' : 'ตรวจสอบก่อนบันทึก',
                text: `${payload.fullname} · ${guardDutyLabel(payload.work_date, payload.shift)} · เข้า ${timeIn || '–'} · ออก ${timeOut || '–'}`,
                showCancelButton: true,
                confirmButtonText: record ? 'ลงเวลาออก' : 'บันทึก',
                cancelButtonText: 'กลับไปแก้ไข'
            });
            if (!result.isConfirmed) return;
        }

        Swal.fire({ title: 'กำลังบันทึก…', allowOutsideClick: false, allowEscapeKey: false, didOpen: () => Swal.showLoading() });
        if (record) {
            const { row: data } = await guardAttendanceRequest('checkout', {
                id: record.id, card: payload.id_card, fullname: payload.fullname, timeOut
            });
            if (!data) {
                await checkActiveSession();
                return Swal.fire('เวรนี้มีการเปลี่ยนแปลง', 'ตรวจสอบรายการล่าสุดก่อนลงเวลาอีกครั้ง', 'info');
            }
        } else {
            await guardAttendanceRequest('insert', { values: payload });
        }

        localStorage.setItem('sec_last_card', payload.id_card);
        localStorage.setItem('sec_last_name', payload.fullname);
        localStorage.setItem('sec_last_shift', payload.shift);
        if (navigator.vibrate) navigator.vibrate(50);

        document.getElementById('time_in').value = '';
        document.getElementById('time_out').value = '';
        document.getElementById('remark_type').value = 'ปกติ';
        handleRemarkChange();
        setActiveRecord(null);
        await checkActiveSession();
        setMode('work');
        await Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
        if (record && payload.work_date < guardBangkokClock().date) {
            bootstrap.Tab.getOrCreateInstance(document.getElementById('tab-past-btn')).show();
        } else {
            bootstrap.Tab.getOrCreateInstance(document.getElementById('tab-today-btn')).show();
        }
        switchPage('history');
    } catch (error) {
        Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
    } finally {
        submitPending = false;
        renderSessionState();
    }
});
</script>
</body>
</html>
