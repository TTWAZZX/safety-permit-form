name: Portal quality

on:
  push:
    branches: [main]
    paths:
      - 'admin-portal*'
      - 'portal-content-manager*'
      - 'safety-dashboard*'
      - 'tests/**'
      - '.github/workflows/portal-quality.yml'
  pull_request:
    paths:
      - 'admin-portal*'
      - 'portal-content-manager*'
      - 'safety-dashboard*'
      - 'tests/**'
      - '.github/workflows/portal-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Portal contract and syntax suite
        run: node tests/run-phase16f.mjs
